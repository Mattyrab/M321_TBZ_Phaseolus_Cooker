apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookerbeaners
  namespace: phaseolus
  labels:
    app: cookerbeaners
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cookerbeaners
  template:
    metadata:
      labels:
        app: cookerbeaners
    spec:
      containers:
        - name: cookerbeaners
          image: cookerbeaners:dev # placeholder — bumped to a git-SHA tag once built and `minikube image load`ed (see architecture plan Q4)
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: RabbitMq__Host
              value: rabbitmq.infra.svc.cluster.local
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__User
              value: phaseolus
            - name: RabbitMq__Pass
              value: phaseolus
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
